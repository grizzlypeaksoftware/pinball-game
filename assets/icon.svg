<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18204a"/>
      <stop offset="1" stop-color="#03040c"/>
    </linearGradient>
    <radialGradient id="neb1" cx="30%" cy="25%" r="55%">
      <stop offset="0" stop-color="#5a2daa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5a2daa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="76%" cy="70%" r="48%">
      <stop offset="0" stop-color="#a01e6e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a01e6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#d2dff5"/>
      <stop offset="0.75" stop-color="#7d8ead"/>
      <stop offset="1" stop-color="#2a3450"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#neb1)"/>
  <rect width="512" height="512" fill="url(#neb2)"/>

  <g fill="#ffffff">
    <circle cx="58" cy="74" r="2.5" opacity="0.8"/>
    <circle cx="146" cy="40" r="1.8" opacity="0.6"/>
    <circle cx="232" cy="96" r="2.2" opacity="0.75"/>
    <circle cx="404" cy="62" r="2.6" opacity="0.85"/>
    <circle cx="470" cy="148" r="1.9" opacity="0.6"/>
    <circle cx="86" cy="206" r="2" opacity="0.7"/>
    <circle cx="438" cy="286" r="2.4" opacity="0.7"/>
    <circle cx="40" cy="352" r="1.8" opacity="0.55"/>
    <circle cx="300" cy="432" r="2.1" opacity="0.6"/>
    <circle cx="190" cy="470" r="1.7" opacity="0.5"/>
  </g>

  <!-- table dome -->
  <path d="M 50 246 A 206 206 0 0 1 462 246" fill="none" stroke="#7d95c9" stroke-width="15" stroke-linecap="round" opacity="0.9"/>

  <!-- flippers -->
  <g stroke="#ff2e55" stroke-width="40" stroke-linecap="round">
    <line x1="133" y1="379" x2="253" y2="437"/>
    <line x1="379" y1="379" x2="259" y2="437"/>
  </g>

  <!-- ball -->
  <circle cx="256" cy="240" r="69" fill="url(#ball)" filter="url(#glow)"/>
  <circle cx="234" cy="217" r="17" fill="#ffffff" opacity="0.95"/>
</svg>
