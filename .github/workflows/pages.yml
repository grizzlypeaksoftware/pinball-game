name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish, but only ever queue one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        # Copy the site into _site rather than uploading the repo root, which
        # would ship .git and the workflow itself to the published site.
        run: |
          mkdir -p _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -xf - -C _site
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
